name: Refresh shared signals

# Cron schedule (UTC).
#
# This used to run every 30 minutes (17 times a day) and it exhausted the
# Firestore free-tier daily read quota by mid-afternoon — which then killed the
# 15:38 ET ENTRY run and the 16:15 ET maintenance run on three consecutive
# sessions. The system silently stopped trading while the signal refresh, which
# nothing in the trading path even reads, consumed the entire allowance.
#
# The trade-the-close runner scans in-process and never reads these documents.
# Only the WEB APP does. Three refreshes a day is ample for a page you look at
# occasionally, and it leaves the quota for the parts that place orders.
#
#   13:15 UTC  ~09:15 ET  pre-open refresh
#   19:00 UTC  ~15:00 ET  late-session refresh
#   21:00 UTC  ~17:00 ET  after the US close (settles the day)
#   11:00 UTC             NSE EOD (~16:30 IST)
on:
  schedule:
    - cron: "15 13 * * 1-5"
    - cron: "0 19 * * 1-5"
    - cron: "0 21 * * 1-5"
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      markets:
        description: 'Comma-separated markets to refresh'
        required: false
        default: 'US,INDIA'
      watchlist_set:
        description: "Watchlist to scan: core | broad"
        required: false
        default: 'core'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run refresh script
        env:
          FIREBASE_PROJECT_ID:           ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ALPHAVANTAGE_KEY:              ${{ secrets.ALPHAVANTAGE_KEY }}
          FINNHUB_KEY:                   ${{ secrets.FINNHUB_KEY }}
          FMP_KEY:                       ${{ secrets.FMP_KEY }}
          ALPACA_KEY:                    ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET:                 ${{ secrets.ALPACA_SECRET }}
          MARKETS:                       ${{ github.event.inputs.markets || 'US,INDIA' }}
          # Manual input wins; otherwise the AUTO_WATCHLIST_SET repo variable (default 'core').
          WATCHLIST_SET:                 ${{ github.event.inputs.watchlist_set || vars.AUTO_WATCHLIST_SET || 'core' }}
        run: node scripts/refresh-signals.mjs
