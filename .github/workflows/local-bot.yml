name: Local RSI2 bot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose config --quiet
      - name: Check Compose container creation and temporary filesystem
        run: |
          docker compose run --rm --no-deps --entrypoint python3 swing -c "from pathlib import Path; Path('/tmp/compose-check').write_text('ok'); print('Compose container started')"
      - name: Test without network access or npm dependencies
        run: docker run --rm --network=none -v "$PWD:/app:ro" swing-stocks-local:latest sh -c 'node --test tests/local-*.mjs'
      - run: python3 -m unittest discover -s tests -p 'test_local_runtime.py' -v
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: .\tests\test-windows-installer.ps1
