# Legacy cloud workflow: manual-only. The local RSI2 bot needs no Firebase jobs.
name: Refresh broad universe (S&P 1500)

# Scans the full US S&P universe (500 large + 400 mid + 600 small) and writes the
# signal documents the WEB APP displays. It does not feed trading: the VM's
# same-day runner evaluates the same universe in-process at 15:38 ET and never
# reads these documents, so this workflow's schedule has no effect on which names
# are traded or how often.
#
# WEEKLY, not daily. Run daily it was the largest consumer of the Firestore free
# tier by a wide margin — ~1,500 names of signal writes against a 20k/day write
# ceiling — and on 2026-09-02 it exhausted the allowance and died with
# `8 RESOURCE_EXHAUSTED` after retrying for its full 600s timeout. Spending the
# scarcest resource in the system on a display, to duplicate a scan the VM had
# already done an hour earlier, was the wrong trade. Sunday evening leaves the
# weekday budget for the runners that place and manage orders.
#
# Use the Alpaca data source (ALPACA_KEY/SECRET) so ~1,500 fetches don't hit the
# keyless rate limits.
on:
  workflow_dispatch:

jobs:
  refresh-broad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Scan broad universe (US)
        env:
          FIREBASE_PROJECT_ID:           ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ALPHAVANTAGE_KEY:              ${{ secrets.ALPHAVANTAGE_KEY }}
          FINNHUB_KEY:                   ${{ secrets.FINNHUB_KEY }}
          FMP_KEY:                       ${{ secrets.FMP_KEY }}
          ALPACA_KEY:                    ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET:                 ${{ secrets.ALPACA_SECRET }}
          MARKETS:                       'US'
          WATCHLIST_SET:                 'broad'
        run: node scripts/refresh-signals.mjs
