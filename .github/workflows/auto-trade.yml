name: Auto-trade (manual only)

# ── DEMOTED: this workflow no longer runs on a schedule. ────────────────────
#
# Execution is now VM-authoritative. The Google VM owns the trading loop:
#
#   swing-sameday.timer      15:38 ET  entries (trade-the-close) + exits
#   swing-maintenance.timer  09:45 ET  reconcile, exits, realize, equity
#                            16:15 ET  same, after the close settles
#
# GitHub Actions keeps ONLY signal refresh (refresh-signals, refresh-broad,
# refresh-universe) and the Pages deploy. Nothing that touches an order runs
# here on a timer any more.
#
# Why: GitHub cron is fixed-UTC (no DST) and best-effort. On this repo scheduled
# runs have started 2-3 HOURS late, been cancelled outright, and failed to
# allocate a runner at all (runner_id: 0 after 15 minutes). That is survivable
# for a signal refresh, which the next run fixes. It is not survivable for
# reconciliation and exit management, where a missed run means an order stuck at
# 'submitted', a position with no managed exit, and a drawdown peak that freezes
# — quietly disabling the halt that is supposed to stop the bleeding.
#
# Running this manually is still useful and still safe: every step is
# idempotent (deterministic client order ids; the exit pass short-circuits on
# exit_submitted), so it will not double-place or double-book against the VM.
# It is the escape hatch for when the VM is down.
#
# Per-user `enabled` + `mode` gate everything, and a live broker URL still
# requires ALLOW_LIVE.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate only (true) / place orders (false). Blank = use the AUTO_DRY_RUN repo variable.'
        required: false
        default: ''
      only_uid:
        description: 'Restrict to a single user uid (optional)'
        required: false
        default: ''
      kill_switch:
        description: 'Global kill switch — abort without placing any orders'
        required: false
        default: 'false'

jobs:
  auto-trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run auto-trade worker
        env:
          FIREBASE_PROJECT_ID:           ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          # Manual input wins; otherwise scheduled runs read the AUTO_DRY_RUN repo
          # variable (defaults to dry-run when unset). Set AUTO_DRY_RUN=false to go live.
          DRY_RUN:     ${{ github.event.inputs.dry_run || vars.AUTO_DRY_RUN || 'true' }}
          ONLY_UID:    ${{ github.event.inputs.only_uid || '' }}
          KILL_SWITCH: ${{ github.event.inputs.kill_switch || 'false' }}
          # Hard gate for REAL MONEY: live broker URLs are blocked unless this is 'true'.
          ALLOW_LIVE:  ${{ vars.ALLOW_LIVE || 'false' }}
        run: node scripts/auto-trade.mjs
